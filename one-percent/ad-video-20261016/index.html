<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>広告動画6案・確認用</title><style>
*{box-sizing:border-box}body{margin:0;background:#101620;color:#f4f6fa;font-family:system-ui,sans-serif}header,main{max-width:1380px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 10px}p{color:#c3ccd7;line-height:1.7}main{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-top:0}article{background:#1c2634;border:1px solid #344357;border-radius:16px;overflow:hidden}video{display:block;width:100%;aspect-ratio:1;background:#000}h2{font-size:17px;margin:16px 18px 8px}a{display:inline-block;color:#a9dfbf;margin:0 18px 18px}button{padding:12px 20px;background:#16a34a;border:0;border-radius:8px;color:white;font-size:15px;cursor:pointer;margin:0 8px 12px 0}@media(max-width:1000px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){main{grid-template-columns:1fr;padding:16px}header{padding:22px 16px}}
button[aria-pressed="false"]{background:#344357}button[aria-pressed="true"]{outline:3px solid #b9f6ce;outline-offset:2px}</style></head><body><header><h1>広告動画6案・確認用</h1><p>各10秒・無音・繰り返し再生。ボタンの演出を切り替えて比較できます。①・⑤は写真を静止させています。</p><div role="group" aria-label="ボタン演出"><button id="soft" aria-pressed="true">控えめ：光が流れる</button><button id="bold" aria-pressed="false">強調：強い光＋輪郭パルス</button></div><p id="mode-label" aria-live="polite">表示中：控えめ版</p><button id="play">すべて再生</button><button id="pause">すべて停止</button></header><main>
<article><video controls loop muted playsinline preload="metadata" poster="../ad-review-20261016/ad-1.png" src="ad-1-button-soft.mp4"></video><h2>1｜現場が忙しくて、営業まで手が回らない。</h2><a href="ad-1-button-soft.mp4" download>MP4を保存</a></article>
<article><video controls loop muted playsinline preload="metadata" poster="../ad-review-20261016/ad-2.png" src="ad-2-button-soft.mp4"></video><h2>2｜案件の紹介も、自分で探すことも。</h2><a href="ad-2-button-soft.mp4" download>MP4を保存</a></article>
<article><video controls loop muted playsinline preload="metadata" poster="../ad-review-20261016/ad-3.png" src="ad-3-button-soft.mp4"></video><h2>3｜今の現場の次、決まっていますか。</h2><a href="ad-3-button-soft.mp4" download>MP4を保存</a></article>
<article><video controls loop muted playsinline preload="metadata" poster="../ad-review-20261016/ad-4.png" src="ad-4-button-soft.mp4"></video><h2>4｜気になる工事を自分で探す。</h2><a href="ad-4-button-soft.mp4" download>MP4を保存</a></article>
<article><video controls loop muted playsinline preload="metadata" poster="../ad-review-20261016/ad-5.png" src="ad-5-button-soft.mp4"></video><h2>5｜いつもの元請け以外にも、仕事のつながりを。</h2><a href="ad-5-button-soft.mp4" download>MP4を保存</a></article>
<article><video controls loop muted playsinline preload="metadata" poster="../ad-review-20261016/ad-6.png" src="ad-6-button-soft.mp4"></video><h2>6｜案件紹介も、工事探しも。</h2><a href="ad-6-button-soft.mp4" download>MP4を保存</a></article>
</main><script>document.querySelector('#play').onclick=()=>document.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}));document.querySelector('#pause').onclick=()=>document.querySelectorAll('video').forEach(v=>v.pause());
function setMode(mode){
 document.querySelectorAll('article').forEach((card,i)=>{
  const v=card.querySelector('video'); const active=!v.paused;
  const url=`ad-${i+1}-button-${mode}.mp4`;
  v.src=url;card.querySelector('a').href=url;v.load();
  if(active)v.play().catch(()=>{});
 });
 document.querySelector('#soft').setAttribute('aria-pressed',String(mode==='soft'));
 document.querySelector('#bold').setAttribute('aria-pressed',String(mode==='bold'));
 document.querySelector('#mode-label').textContent='表示中：'+(mode==='soft'?'控えめ版':'強調版');
}
document.querySelector('#soft').onclick=()=>setMode('soft');
document.querySelector('#bold').onclick=()=>setMode('bold');
</script></body></html>

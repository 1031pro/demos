<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>① 文字アニメーション5案</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#292722;font-family:system-ui,sans-serif}main{max-width:1640px;margin:auto;padding:24px}h1{font-size:clamp(20px,2.2vw,30px);margin:0 0 20px}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0}figcaption{font-weight:700;font-size:16px;margin:0 0 7px}canvas{display:block;width:100%;height:auto;background:#fff}@media(min-width:1500px){section{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:850px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{padding:14px}section{grid-template-columns:1fr}}
</style><main><h1>① 文字アニメーション5案</h1><section></section></main><script src="geometry.js"></script><script>
const names=['A　語句を3拍で','B　文字を刻む','C　下から立ち上がる','D　スタンプ','E　中央から開く'];
const boards=names.map(name=>{const f=document.createElement('figure'),label=document.createElement('figcaption'),c=document.createElement('canvas');label.textContent=name;c.width=c.height=840;c.setAttribute('aria-label',name+'：現場が忙しくて、営業まで手が回らない。');f.append(label,c);document.querySelector('section').append(f);return c.getContext('2d')});
function load(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url})}
const clamp=x=>Math.min(1,Math.max(0,x));
Promise.all(['base-1.webp','glow-1.png','type-1-1.png','type-1-2.png','type-1-3.png'].map(load)).then(([base,mask,...type])=>{
 const shine=document.createElement('canvas');shine.width=shine.height=840;const sc=shine.getContext('2d');const start=performance.now();
 function render(now){
 const t=((now-start)/1000)%5, scale=840/1254;
 sc.clearRect(0,0,840,840);const center=(-.3+t/2.4*1.6)*840;
 if(t<2.4){const g=sc.createLinearGradient(center-85,0,center+85,0);g.addColorStop(0,'transparent');g.addColorStop(.5,'rgba(255,255,255,.30)');g.addColorStop(1,'transparent');sc.fillStyle=g;sc.fillRect(0,0,840,840);sc.globalCompositeOperation='destination-in';sc.drawImage(mask,0,0,840,840);sc.globalCompositeOperation='source-over'}
 boards.forEach((ctx,mode)=>{ctx.setTransform(scale,0,0,scale,0,0);ctx.drawImage(base,0,0,1254,1254);
 geometry[1].forEach(({x,y,w,h,cuts},j)=>{const age=t-j*[.13,.15,.12,.15,.11][mode];if(age<0)return;const pic=type[j];ctx.save();
 if(mode===0){ctx.drawImage(pic,x,y)}
 if(mode===1){for(let q=0;q<cuts.length-1;q++){if(age<q*.041)continue;const l=cuts[q],width=cuts[q+1]-l;ctx.drawImage(pic,l,0,width,h,x+l,y,width,h)}}
 if(mode===2){const ease=1-Math.pow(1-clamp((age+.024)/.23),3);ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(pic,x,y+h*(1-ease))}
 if(mode===3){const p=clamp(age/.24),s=1+.18*Math.exp(-5*p)*Math.cos(7*p)*(1-p);ctx.translate(x+w/2,y+h/2);ctx.scale(s,s);ctx.drawImage(pic,-w/2,-h/2)}
 if(mode===4){const p=1-Math.pow(1-clamp((age+.012)/.28),2);ctx.beginPath();ctx.rect(x+w*(1-p)/2,y,w*p,h);ctx.clip();ctx.drawImage(pic,x,y)}
 ctx.restore()});ctx.drawImage(shine,0,0,1254,1254)});requestAnimationFrame(render)}
 requestAnimationFrame(render)})
</script></html>

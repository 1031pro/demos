<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>広告デザイン比較｜全9案</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f2ef;color:#202a33;font-family:Meiryo,sans-serif}header{padding:30px max(20px,4vw);background:#fff;border-bottom:1px solid #ddd}h1{font-size:26px;margin:0 0 10px}p{line-height:1.8;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button,a.link{font:inherit;border:1px solid #bcc4cb;background:#fff;border-radius:6px;padding:9px 15px;color:#263542;cursor:pointer}button[aria-pressed=true]{background:#263542;color:white}main{padding:24px max(20px,4vw)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}.card h2{font-size:17px;margin:0;padding:16px}.thumb{display:block;padding:0;border:0;border-radius:0;width:100%;background:#eee}.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.foot{padding:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}.foot a{color:#275f78}dialog{border:0;border-radius:10px;padding:15px;background:#15191d;color:white;max-width:96vw;max-height:96vh}dialog::backdrop{background:#000c}.modalbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:10px}.modalbar h2{font-size:16px;margin:0}#full{display:block;max-width:90vw;max-height:78vh;object-fit:contain;margin:auto}.nav{display:flex;gap:8px;justify-content:center;margin-top:12px}button:focus-visible,a:focus-visible{outline:3px solid #ed9200;outline-offset:3px}[hidden]{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:22px}}</style></head>
<body><header><h1>広告デザイン比較｜全9案</h1><p>画像をクリックすると拡大できます。拡大中は左右の矢印キーで切り替え、Escで閉じられます。</p><div class="toolbar" aria-label="表示する案"><button data-filter="all" aria-pressed="true">すべて（6案）</button><button data-filter="first" aria-pressed="false">既存案 A〜C</button><button data-filter="new" aria-pressed="false">追加案 D〜F</button></div></header><main><div class="grid" id="grid"></div><p>静止画の比較用です。人物・施工風景・図面は生成画像で、実案件や実績を示すものではありません。掲載画像のLINEボタンはデザインの一部です。</p></main>
<dialog id="viewer" aria-labelledby="viewtitle"><div class="modalbar"><h2 id="viewtitle"></h2><button id="close">閉じる ×</button></div><img id="full" alt=""><div class="nav"><button id="prev">← 前の案</button><button id="next">次の案 →</button></div></dialog>
<script>
const ads=[['A','仕事不足への共感','ad-a-empathy.png','first'],['B','無料を主役に','ad-b-free.png','first'],['C','新しい取引先との接点','ad-c-connections.png','first'],['D','黒地・工具・タイポグラフィ','ad-d-poster-green.png','new'],['E','生成り・建築図面','ad-e-drawing-green.png','new'],['F','イラスト・仕事のつながり','ad-f-illustration-green.png','new']];
const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');let active=0,filter='all';
ads.unshift(['G','現場は得意。営業まで、手が回らない。','ad-g-owner.png','revised'],['H','次の取引先と、まずは話してみませんか。','ad-h-meeting.png','revised'],['I','得意な工事で、仕事の幅を広げる。','ad-i-craft.png','revised']);
document.title='広告デザイン比較｜全9案';document.querySelector('h1').textContent=document.title;
document.querySelector('[data-filter="all"]').textContent='すべて（9案）';
const revised=document.createElement('button');revised.dataset.filter='revised';revised.setAttribute('aria-pressed','false');revised.textContent='新規制作 G〜I';document.querySelector('.toolbar').prepend(revised);
ads.forEach(([id,title,src,group],i)=>{const article=document.createElement('article');article.className='card';article.dataset.group=group;article.innerHTML=`<h2>${id}｜${title}</h2><button class="thumb" aria-label="${id}案を拡大"><img src="${src}" alt="${id}｜${title}"></button><div class="foot"><a href="${src}" target="_blank" rel="noopener">原寸で開く</a><a href="${src}" download>PNGを保存</a></div>`;article.querySelector('button').onclick=()=>show(i);grid.append(article)});
function show(i){active=i;const [id,title,src]=ads[i];document.querySelector('#viewtitle').textContent=`${id}｜${title}`;document.querySelector('#full').src=src;document.querySelector('#full').alt=`${id}｜${title}`;if(!viewer.open)viewer.showModal()}
function step(n){const visible=ads.map((a,i)=>i).filter(i=>filter==='all'||ads[i][3]===filter);show(visible[(visible.indexOf(active)+n+visible.length)%visible.length])}
document.querySelector('#close').onclick=()=>viewer.close();document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.card').forEach(c=>c.hidden=filter!=='all'&&c.dataset.group!==filter)});
</script></body></html>

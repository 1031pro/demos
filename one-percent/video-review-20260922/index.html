<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' blob:; media-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'"><title>施工会社募集動画｜確認用</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main>
<header><p class="eyebrow">動画確認</p><h1>施工会社募集動画</h1><p class="intro">冒頭キャッチ10案の確認ページです。</p></header>
<section id="gate" class="gate"><h2>パスワードを入力</h2><p>共有されたパスワードで動画を開けます。</p><form id="unlock"><label for="password">パスワード</label><div class="input-row"><input id="password" type="password" autocomplete="current-password" required spellcheck="false"><button id="submit" type="submit">開く</button></div><p id="message" role="status" aria-live="polite"></p></form></section>
<section id="review" hidden><div class="toolbar"><p>確認したい案の「動画を開く」を押してください。</p><button id="logout" class="secondary" type="button">ロックする</button></div><div id="grid" class="grid"></div></section>
<noscript><p>動画の表示にはJavaScriptを有効にしてください。</p></noscript>
</main><footer>確認用</footer></body></html>
